<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDR Viewer</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --card: #ffffff; --line: #deded8; --accent: #2f6fdb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ececea; --muted: #a3a39e; --card: #20201f; --line: #353533; --accent: #7aa7ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  #drop { display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; background: var(--card); cursor: pointer; }
  #drop.over { border-color: var(--accent); }
  #out { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; margin-top: 20px; }
  @media (max-width: 760px) { #out { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  #canvas svg { width: 100%; height: auto; display: block; box-shadow: 0 1px 6px rgba(0,0,0,.15); background: #fff; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  pre { font-size: 12px; overflow: auto; max-height: 360px; background: var(--bg); padding: 8px; border-radius: 8px; }
  .warn { color: #b26b00; }
  .err { color: #c62828; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>CDR Viewer</h1>
  <p class="lead">Open a CorelDRAW <code>.cdr</code> file. Everything runs in this page; nothing is uploaded.</p>
  <label id="drop">Drop a .cdr file here or click to choose one
    <input id="file" type="file" accept=".cdr,.cdt,.cmx" hidden>
  </label>
  <p id="status"></p>
  <section id="out" hidden>
    <div class="card"><div id="canvas"></div><p><button id="save">Download SVG</button></p></div>
    <div class="card">
      <dl id="facts"></dl>
      <h3>Warnings</h3><ul id="warnings"></ul>
      <h3>Chunk tree</h3><pre id="tree"></pre>
    </div>
  </section>
</main>
<script type="module">
  import { readCdr, toSvg, formatTree } from '../src/index.js';

  const $ = (id) => document.getElementById(id);
  let lastSvg = '', lastName = 'drawing';

  async function open(file) {
    $('status').textContent = `Reading ${file.name}…`;
    $('status').className = '';
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const doc = await readCdr(bytes, { keepTree: true });
      lastSvg = toSvg(doc);
      lastName = file.name.replace(/\.[^.]+$/, '');
      $('canvas').innerHTML = lastSvg.replace(/^<\?xml[^>]*>/, '');
      const pages = doc.pages.filter((p) => !p.master);
      const count = (objs) => objs.reduce((n, o) => n + (o.kind === 'group' ? count(o.children) : 1), 0);
      const facts = {
        Product: doc.format.product,
        Version: doc.format.version,
        Container: doc.format.container,
        Page: `${doc.pageSize.width.toFixed(1)} × ${doc.pageSize.height.toFixed(1)} mm`,
        Pages: pages.length,
        Objects: pages.reduce((n, p) => n + p.layers.reduce((m, l) => m + count(l.objects), 0), 0),
        Fills: Object.keys(doc.fills).length,
        Outlines: Object.keys(doc.outlines).length,
        Styles: Object.keys(doc.styles).length,
        Author: doc.metadata?.Author ?? '—',
      };
      $('facts').innerHTML = Object.entries(facts).map(([k, v]) => `<dt>${k}</dt><dd>${String(v).replace(/</g, '&lt;')}</dd>`).join('');
      $('warnings').innerHTML = doc.warnings.length ? doc.warnings.map((w) => `<li class="warn">${w.replace(/</g, '&lt;')}</li>`).join('') : '<li>none</li>';
      $('tree').textContent = formatTree(doc.tree, { hex: 12 });
      $('out').hidden = false;
      $('status').textContent = '';
    } catch (err) {
      $('out').hidden = true;
      $('status').textContent = err.message;
      $('status').className = 'err';
    }
  }

  $('file').addEventListener('change', (e) => e.target.files[0] && open(e.target.files[0]));
  const drop = $('drop');
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) open(e.dataTransfer.files[0]); });
  $('save').addEventListener('click', () => {
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([lastSvg], { type: 'image/svg+xml' })), download: `${lastName}.svg` });
    a.click();
    URL.revokeObjectURL(a.href);
  });
</script>
</body>
</html>
